<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>
    <style>
        .product-card {
            width: 250px;
            border: 2px solid #ccc;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin: 20px auto;
        }

        .product-card:hover {
            border-color: #000;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); /* Sahi syntax */
        }

        .product-card img {
            width: 100%;
            height: auto;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
            margin: 10px 0;
        }

        .buy-btn {
            background-color: blue;
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .buy-btn:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <!-- Image & Title -->
        <img src="watch.png"Product Image">
        <h3>Smart Watch</h3>

        <!-- Short Description -->
        <p>This is a basic smart watch with simple features.</p>

        <!-- Price Tag -->
        <div class="price">$50</div>

        <!-- Buy Now Button -->
        <button class="buy-btn">Buy Now</button>
    </div>

</body>
</html>
