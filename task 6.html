<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .table-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Grade</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ali</td>
                    <td>16</td>
                    <td>10th</td>
                    <td>ali@email.com</td>
                </tr>
                <tr>
                    <td>Ahmed</td>
                    <td>17</td>
                    <td>11th</td>
                    <td>ahmed@email.com</td>
                </tr>
                <tr>
                    <td>Sara</td>
                    <td>15</td>
                    <td>9th</td>
                    <td>sara@email.com</td>
                </tr>
                <tr>
                    <td>Zara</td>
                    <td>16</td>
                    <td>10th</td>
                    <td>zara@email.com</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
